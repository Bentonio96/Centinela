<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b3a22" />
    <meta
      name="description"
      content="Centinela: consola de operaciones de seguridad. Panel bento, triaje de incidentes, tablero kanban, calendario de guardias, analítica y equipo."
    />
    <title>Centinela — Operaciones de seguridad</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Aplica tema y acento guardados antes del primer pintado. El tema claro con
      acento bosque ya es el valor por defecto del CSS, así que esto sólo
      corrige a quien eligió otra cosa; sin esto vería un destello en cada carga.

      La clave antigua `centinela:theme` se ignora a propósito: la versión
      anterior la escribía en cada visita con su valor por defecto, así que no
      refleja una elección. Ver `src/data/settings.ts`.
    -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('centinela:settings') || '{}');
        if (saved.theme === 'dark') document.documentElement.classList.add('dark');
        if (typeof saved.accent === 'string' && saved.accent !== 'forest') {
          document.documentElement.dataset.accent = saved.accent;
        }
      } catch (error) {
        /* localStorage bloqueado o corrupto: se mantienen los valores por defecto. */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
