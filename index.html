<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      `only light`: la consola no tiene tema oscuro, y esto le dice al navegador
      que tampoco le aplique el suyo (el oscurecido automático de algunos
      navegadores móviles, los controles nativos en oscuro).
    -->
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#0b3a22" />
    <meta
      name="description"
      content="Centinela: consola de operaciones de seguridad. Panel bento, triaje de incidentes, tablero kanban, calendario de guardias, analítica y equipo."
    />
    <title>Centinela — Operaciones de seguridad</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Aplica el acento guardado antes del primer pintado. El acento bosque ya es
      el valor por defecto del CSS, así que esto sólo corrige a quien eligió
      otro; sin esto vería un destello verde en cada carga.

      El tema no se lee de ningún sitio: es claro, siempre.
    -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('centinela:settings') || '{}');
        if (typeof saved.accent === 'string' && saved.accent !== 'forest') {
          document.documentElement.dataset.accent = saved.accent;
        }
      } catch (error) {
        /* localStorage bloqueado o corrupto: se mantienen los valores por defecto. */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
