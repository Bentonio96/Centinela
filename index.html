<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Dashboard de monitoreo de incidentes de ciberseguridad: métricas, tendencia diaria, distribución por categoría y triaje de incidentes."
    />
    <title>Centinela — Monitoreo de incidentes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Aplica el tema guardado antes del primer pintado. El tema oscuro ya es el
      valor por defecto del CSS, así que esto sólo corrige el caso del usuario
      que eligió el claro; sin esto vería un destello oscuro en cada carga.
    -->
    <script>
      try {
        if (localStorage.getItem('centinela:theme') === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch (error) {
        /* localStorage bloqueado: se mantiene el tema oscuro por defecto. */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
